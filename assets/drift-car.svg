<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="smoke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff00;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="road-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff00;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- Road surface line -->
  <line x1="0" y1="165" x2="800" y2="165" stroke="url(#road-line)" stroke-width="1"/>

  <!-- Drift tire marks -->
  <g filter="url(#glow)" opacity="0">
    <path d="M 50,162 Q 150,158 250,160 T 450,155" stroke="#00ff00" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="8,4"/>
    <path d="M 60,168 Q 160,164 260,166 T 460,161" stroke="#00ff00" stroke-width="2" fill="none" opacity="0.2" stroke-dasharray="6,6"/>
    <animate attributeName="opacity" values="0;0;0.6;0.4;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.3;0.5;0.8;1"/>
  </g>

  <!-- Smoke particles behind car -->
  <g opacity="0">
    <ellipse cx="0" cy="150" rx="30" ry="15" fill="url(#smoke-grad)">
      <animate attributeName="cx" values="350;300;250" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="20;40;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="155" rx="25" ry="12" fill="url(#smoke-grad)">
      <animate attributeName="cx" values="370;310;240" dur="6s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="rx" values="15;35;55" dur="6s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="6s" repeatCount="indefinite" begin="0.3s"/>
    </ellipse>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.2;0.4;0.8;1"/>
  </g>

  <!-- ===== DRIFT CAR (side view, angled for drift) ===== -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="-200,0; 400,0; 900,0" dur="6s" repeatCount="indefinite" keyTimes="0;0.5;1"/>

    <!-- Car body rotation for drift angle -->
    <g transform="rotate(-8, 400, 145)">
      <!-- Car underbody / shadow -->
      <rect x="355" y="148" width="95" height="4" rx="2" fill="#00ff00" opacity="0.1"/>

      <!-- Main body -->
      <path d="M 360,148 L 365,132 L 380,124 L 415,122 L 435,126 L 445,132 L 450,148 Z"
            fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.9"/>

      <!-- Roof line -->
      <path d="M 382,124 L 388,116 L 420,116 L 430,124"
            fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.8"/>

      <!-- Windshield -->
      <path d="M 382,124 L 388,116" stroke="#00ff00" stroke-width="1" opacity="0.5"/>
      <path d="M 430,124 L 420,116" stroke="#00ff00" stroke-width="1" opacity="0.5"/>

      <!-- Window glass hint -->
      <path d="M 384,123 L 389,117 L 419,117 L 428,123 Z" fill="#00ff00" opacity="0.05"/>

      <!-- Hood detail -->
      <line x1="370" y1="130" x2="380" y2="124" stroke="#00ff00" stroke-width="0.8" opacity="0.4"/>

      <!-- Trunk detail -->
      <line x1="440" y1="130" x2="435" y2="126" stroke="#00ff00" stroke-width="0.8" opacity="0.4"/>

      <!-- Headlights -->
      <rect x="357" y="136" width="4" height="3" rx="1" fill="#00ff00" opacity="0.9">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="0.5s" repeatCount="indefinite"/>
      </rect>

      <!-- Taillights -->
      <rect x="448" y="136" width="4" height="3" rx="1" fill="#ff0040" opacity="0.8">
        <animate attributeName="opacity" values="0.8;1;0.6;1" dur="0.3s" repeatCount="indefinite"/>
      </rect>

      <!-- Front wheel -->
      <circle cx="378" cy="152" r="8" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.8"/>
      <circle cx="378" cy="152" r="4" fill="none" stroke="#00ff00" stroke-width="0.8" opacity="0.4"/>
      <!-- Wheel spin -->
      <line x1="374" y1="152" x2="382" y2="152" stroke="#00ff00" stroke-width="0.5" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0 378 152" to="360 378 152" dur="0.3s" repeatCount="indefinite"/>
      </line>

      <!-- Rear wheel -->
      <circle cx="432" cy="152" r="8" fill="none" stroke="#00ff00" stroke-width="1.5" opacity="0.8"/>
      <circle cx="432" cy="152" r="4" fill="none" stroke="#00ff00" stroke-width="0.8" opacity="0.4"/>
      <!-- Wheel spin (slower - drifting) -->
      <line x1="428" y1="152" x2="436" y2="152" stroke="#00ff00" stroke-width="0.5" opacity="0.3">
        <animateTransform attributeName="transform" type="rotate" from="0 432 152" to="360 432 152" dur="0.15s" repeatCount="indefinite"/>
      </line>

      <!-- Speed lines -->
      <g opacity="0.4">
        <line x1="455" y1="130" x2="475" y2="130" stroke="#00ff00" stroke-width="0.8">
          <animate attributeName="x2" values="475;485;475" dur="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.4;0.1;0.4" dur="0.4s" repeatCount="indefinite"/>
        </line>
        <line x1="455" y1="138" x2="480" y2="138" stroke="#00ff00" stroke-width="0.8">
          <animate attributeName="x2" values="480;495;480" dur="0.35s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;0.1;0.3" dur="0.35s" repeatCount="indefinite"/>
        </line>
        <line x1="455" y1="146" x2="470" y2="146" stroke="#00ff00" stroke-width="0.8">
          <animate attributeName="x2" values="470;482;470" dur="0.45s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;0.1;0.35" dur="0.45s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- Ground sparks -->
  <g opacity="0">
    <circle cx="0" cy="162" r="1" fill="#00ff00">
      <animate attributeName="cx" values="420;415;405" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="162;158;155" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="162" r="1" fill="#00ff00">
      <animate attributeName="cx" values="425;418;410" dur="0.4s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="cy" values="162;156;150" dur="0.4s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="1;0" dur="0.4s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="0" cy="162" r="0.8" fill="#ffffff">
      <animate attributeName="cx" values="422;412;400" dur="0.35s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="cy" values="162;154;148" dur="0.35s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.35s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.25;0.4;0.7;0.85"/>
  </g>

  <!-- DRIFT text that appears -->
  <text x="400" y="80" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#00ff00" filter="url(#glow-strong)" opacity="0">
    DRIFT
    <animate attributeName="opacity" values="0;0;0.8;0.8;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.45;0.7;0.85"/>
  </text>

  <!-- Scanline effect overlay -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="4" x2="800" y2="4" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="8" x2="800" y2="8" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="12" x2="800" y2="12" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="16" x2="800" y2="16" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="20" x2="800" y2="20" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="24" x2="800" y2="24" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="28" x2="800" y2="28" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="32" x2="800" y2="32" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="36" x2="800" y2="36" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="44" x2="800" y2="44" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="48" x2="800" y2="48" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="52" x2="800" y2="52" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="56" x2="800" y2="56" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="60" x2="800" y2="60" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="64" x2="800" y2="64" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="68" x2="800" y2="68" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="72" x2="800" y2="72" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="76" x2="800" y2="76" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="84" x2="800" y2="84" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="88" x2="800" y2="88" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="92" x2="800" y2="92" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="96" x2="800" y2="96" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="104" x2="800" y2="104" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="108" x2="800" y2="108" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="112" x2="800" y2="112" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="116" x2="800" y2="116" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="124" x2="800" y2="124" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="128" x2="800" y2="128" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="132" x2="800" y2="132" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="136" x2="800" y2="136" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="140" x2="800" y2="140" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="144" x2="800" y2="144" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="148" x2="800" y2="148" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="152" x2="800" y2="152" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="156" x2="800" y2="156" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="164" x2="800" y2="164" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="168" x2="800" y2="168" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="172" x2="800" y2="172" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="176" x2="800" y2="176" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="184" x2="800" y2="184" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="188" x2="800" y2="188" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="192" x2="800" y2="192" stroke="#00ff00" stroke-width="1"/>
    <line x1="0" y1="196" x2="800" y2="196" stroke="#00ff00" stroke-width="1"/>
  </g>
</svg>
