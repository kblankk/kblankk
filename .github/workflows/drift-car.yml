name: Generate Drift Car Animation

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_drift.py"
      - ".github/workflows/drift-car.yml"

permissions:
  contents: write

concurrency:
  group: drift-car
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate drift car SVG
        env:
          # Prefer a personal PAT (read:user scope) so private contributions
          # are included; fall back to the workflow token (public only).
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_drift.py kblankk dist/drift-car.svg

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
